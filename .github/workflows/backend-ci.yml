name: Backend CI

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build-and-test:
    name: Build & Test .NET Solution
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        cache: true
        
    - name: Restore dependencies
      run: dotnet restore VeggieLife.sln
      
    - name: Build Solution (Release)
      run: dotnet build VeggieLife.sln --no-restore -c Release
      
    - name: Dependency Vulnerability Audit
      run: |
        echo "Auditing package vulnerabilities..."
        dotnet list package --vulnerable --include-transitive || true

    - name: Setup Test Configuration
      run: cp src/VeggieLife.API/appsettings.Example.json src/VeggieLife.API/appsettings.json

    - name: Increase inotify limit
      run: sudo sysctl fs.inotify.max_user_instances=1024

    - name: Run System Regression Test Suite (Strict 100% Pass)
      env:
        DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE: "false"
        ConnectionStrings__DefaultConnection: "Server=(localdb)\\MSSQLLocalDB;Database=VeggieLifeDb;Trusted_Connection=True;TrustServerCertificate=True;"
        ConnectionStrings__Redis: "localhost:6379,abortConnect=false"
        Jwt__SecretKey: "VeggieLifeSecretKeyForDevelopmentMustBe32CharsLong!"
        Jwt__Issuer: "VeggieLife.API"
        Jwt__Audience: "VeggieLife.Client"
        Jwt__AccessTokenExpiryMinutes: "120"
        GuestSecurity__RateLimitPerMinute: "10"
        GuestSecurity__BanDurationMinutes: "10"
        GuestSecurity__EnforceVietnamOnly: "false"
        GuestSecurity__AllowedCountryCodes__0: "VN"
        Smtp__ActiveProvider: "Resend"
        Smtp__Resend__Password: "re_dummy_test_key"
        Smtp__Resend__From: "onboarding@resend.dev"
        Smtp__Resend__DisplayName: "VeggieLife"
      run: dotnet test tests/VeggieLife.Tests/VeggieLife.Tests.csproj --no-build -c Release --filter "FullyQualifiedName~SystemRegressionTestSuite" --verbosity normal

    - name: Run Full Test Suite with TRX Logger
      env:
        DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE: "false"
        ConnectionStrings__DefaultConnection: "Server=(localdb)\\MSSQLLocalDB;Database=VeggieLifeDb;Trusted_Connection=True;TrustServerCertificate=True;"
        ConnectionStrings__Redis: "localhost:6379,abortConnect=false"
        Jwt__SecretKey: "VeggieLifeSecretKeyForDevelopmentMustBe32CharsLong!"
        Jwt__Issuer: "VeggieLife.API"
        Jwt__Audience: "VeggieLife.Client"
        Jwt__AccessTokenExpiryMinutes: "120"
        GuestSecurity__RateLimitPerMinute: "10"
        GuestSecurity__BanDurationMinutes: "10"
        GuestSecurity__EnforceVietnamOnly: "false"
        GuestSecurity__AllowedCountryCodes__0: "VN"
        Smtp__ActiveProvider: "Resend"
        Smtp__Resend__Password: "re_dummy_test_key"
        Smtp__Resend__From: "onboarding@resend.dev"
        Smtp__Resend__DisplayName: "VeggieLife"
      run: |
        dotnet test tests/VeggieLife.Tests/VeggieLife.Tests.csproj --no-build -c Release --logger "trx;LogFileName=test-results.trx" || echo "Some tests failed. Report generated."

    - name: Upload Test Results Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backend-test-results
        path: tests/VeggieLife.Tests/TestResults/test-results.trx
        retention-days: 7

  docker-verify:
    name: Docker Container Build Verification
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build Backend Docker Image
      run: docker build -t veggielife-backend:ci .
