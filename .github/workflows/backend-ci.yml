name: Backend CI

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore VeggieLife.sln
      
    - name: Build
      run: dotnet build VeggieLife.sln --no-restore
      
    - name: Run Tests
      run: dotnet test tests/VeggieLife.Tests/VeggieLife.Tests.csproj --no-build --verbosity normal
