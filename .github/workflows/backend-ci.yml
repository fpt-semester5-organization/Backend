name: Backend CI

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore src/VeggieLife.API/VeggieLife.API.csproj
      
    - name: Build
      run: dotnet build src/VeggieLife.API/VeggieLife.API.csproj --no-restore
      
    - name: Run Integration Tests
      # Testcontainers yêu cầu Docker, mặc định runners ubuntu-latest đã cài sẵn Docker
      run: dotnet test tests/VeggieLife.Tests/VeggieLife.Tests.csproj --no-build --verbosity normal
