name: Backend CD (Deploy)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT || 'veggielife-510817' }}
  REGION: ${{ secrets.GCP_REGION || 'asia-southeast1' }}
  SERVICE_NAME: veggielife-backend
  FE_SERVICE: veggielife-frontend
  VM_IP: "10.148.0.2"
  AI_PORT: "8081"

jobs:
  deploy-cloud-run:
    name: Build & Deploy Backend to Google Cloud Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Calculate Environment Variables and Image Tags
        id: vars
        run: |
          PROJECT_NUMBER=$(gcloud projects describe ${{ env.PROJECT_ID }} --format='value(projectNumber)')
          FE_URL="https://${{ env.FE_SERVICE }}-${PROJECT_NUMBER}.${{ env.REGION }}.run.app"
          STT_URL="https://stt-service-${PROJECT_NUMBER}.${{ env.REGION }}.run.app"
          SA="veggielife-backend@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/veggielife/backend:${{ github.sha }}"
          IMAGE_LATEST="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/veggielife/backend:latest"
          
          echo "fe_url=${FE_URL}" >> "$GITHUB_OUTPUT"
          echo "stt_url=${STT_URL}" >> "$GITHUB_OUTPUT"
          echo "sa=${SA}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${IMAGE_LATEST}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        run: |
          docker build -t "${{ steps.vars.outputs.image }}" -t "${{ steps.vars.outputs.image_latest }}" .
          docker push "${{ steps.vars.outputs.image }}"
          docker push "${{ steps.vars.outputs.image_latest }}"

      - name: Deploy to Cloud Run
        run: |
          ENV_VARS="^|^ASPNETCORE_ENVIRONMENT=Production|ASPNETCORE_FORWARDEDHEADERS_ENABLED=true|Database__UseInMemory=false"
          ENV_VARS+="|Jwt__Issuer=VeggieLife.API|Jwt__Audience=VeggieLife.Client|Jwt__AccessTokenExpiryMinutes=15"
          ENV_VARS+="|JwtSettings__Issuer=VeggieLife|JwtSettings__Audience=VeggieLifeUsers"
          ENV_VARS+="|AiService__BaseUrl=http://${{ env.VM_IP }}:${{ env.AI_PORT }}|AiService__SttBaseUrl=${{ steps.vars.outputs.stt_url }}"
          ENV_VARS+="|Cors__AllowedOrigins=${{ steps.vars.outputs.fe_url }}"
          ENV_VARS+="|Google__ClientId=${{ secrets.GOOGLE_CLIENT_ID }}|Cloudinary__CloudName=${{ secrets.CLOUDINARY_CLOUD_NAME }}|Goong__BaseUrl=https://rsapi.goong.io"
          ENV_VARS+="|Payment__PayOS__ReturnUrl=${{ steps.vars.outputs.fe_url }}/payment/success|Payment__PayOS__CancelUrl=${{ steps.vars.outputs.fe_url }}/payment/cancel"
          ENV_VARS+="|Payment__VietQR__BankId=MB|Payment__VietQR__AccountNo=${{ secrets.VIETQR_ACCOUNT_NO }}|Payment__VietQR__AccountName=VeggieLife"
          ENV_VARS+="|Smtp__ActiveProvider=Gmail|Smtp__Gmail__Host=smtp.gmail.com|Smtp__Gmail__Port=587|Smtp__Gmail__EnableSsl=true"
          ENV_VARS+="|Smtp__Gmail__User=${{ secrets.SMTP_USER }}|Smtp__Gmail__From=${{ secrets.SMTP_USER }}|Smtp__Gmail__DisplayName=VeggieLife"

          SECRETS="ConnectionStrings__DefaultConnection=veggielife-db-connection:latest"
          SECRETS+=",ConnectionStrings__Redis=veggielife-redis-connection:latest"
          SECRETS+=",Jwt__SecretKey=veggielife-jwt-key:latest,JwtSettings__SecretKey=veggielife-jwt-key:latest"
          SECRETS+=",AiService__InternalApiKey=veggielife-ai-internal-key:latest"
          SECRETS+=",Google__ClientSecret=veggielife-google-client-secret:latest"
          SECRETS+=",Cloudinary__ApiKey=veggielife-cloudinary-api-key:latest,Cloudinary__ApiSecret=veggielife-cloudinary-api-secret:latest"
          SECRETS+=",Goong__ApiKey=veggielife-goong-api-key:latest,Goong__MapKey=veggielife-goong-map-key:latest"
          SECRETS+=",Payment__PayOS__ClientId=veggielife-payos-client-id:latest,Payment__PayOS__ApiKey=veggielife-payos-api-key:latest,Payment__PayOS__ChecksumKey=veggielife-payos-checksum-key:latest"
          SECRETS+=",Payment__VietQR__SecretKey=veggielife-vietqr-secret:latest"
          SECRETS+=",Smtp__Gmail__Password=veggielife-smtp-password:latest"

          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --image "${{ steps.vars.outputs.image }}" \
            --service-account "${{ steps.vars.outputs.sa }}" \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 1 \
            --max-instances 1 \
            --no-cpu-throttling \
            --concurrency 80 \
            --timeout 3600 \
            --network default \
            --subnet default \
            --vpc-egress private-ranges-only \
            --allow-unauthenticated \
            --set-env-vars "$ENV_VARS" \
            --set-secrets "$SECRETS"

      - name: Health Check
        run: |
          BE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --project ${{ env.PROJECT_ID }} --region ${{ env.REGION }} --format='value(status.url)')
          echo "Backend deployed at: $BE_URL"
          echo "Pinging health endpoint..."
          curl -sf "$BE_URL/health" || echo "Note: Health check via VPC may require direct internal access."
